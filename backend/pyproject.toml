[project]
name = "hivemind-backend"
version = "0.0.0"
description = "simulated quick-commerce grocery business: postgres schemas and read apis"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "psycopg[binary]==3.3.8",
]

[project.scripts]
hm-db = "hivemind_backend.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
