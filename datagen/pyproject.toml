[project]
name = "hivemind-datagen"
version = "0.0.0"
description = "made-up data for the simulated business, from a seed, with injected faults and hidden truth"
requires-python = "==3.12.*"
dependencies = [
    "hivemind-backend",
    "psycopg[binary]==3.3.8",
]

[project.scripts]
hm-seed = "hivemind_datagen.cli:main"

[tool.uv.sources]
hivemind-backend = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
