[project]
name = "hivemind"
version = "0.0.0"
description = "multi-agent customer support for a simulated quick-commerce grocery business"
requires-python = "==3.12.*"
dependencies = ["hivemind-backend", "hivemind-datagen", "hivemind-agents", "hivemind-evals"]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "httpx2==2.16.0",
    "jsonschema==4.26.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["backend", "datagen", "agents", "evals"]

[tool.uv.sources]
hivemind-backend = { workspace = true }
hivemind-datagen = { workspace = true }
hivemind-agents = { workspace = true }
hivemind-evals = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["datagen/tests", "backend/tests", "agents/tests", "evals/tests"]
markers = [
    "db: needs the local postgres started by docker compose",
    "live_capable: runs on the real models when --live-llm is given",
]
addopts = "--import-mode=importlib"
pythonpath = ["agents/tests", "backend/tests"]
