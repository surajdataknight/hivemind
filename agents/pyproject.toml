[project]
name = "hivemind-agents"
version = "0.0.0"
description = "hivemind itself: the capabilities, the case graph and the chat service"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.4",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "psycopg[binary]==3.3.8",
    "pyjwt==2.15.1",
    "httpx==0.28.1",
    "langgraph==1.2.20",
    "langchain-core==1.7.6",
    "google-genai==2.34.0",
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
]

[project.scripts]
hm-agents = "hivemind_agents.cli:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"
